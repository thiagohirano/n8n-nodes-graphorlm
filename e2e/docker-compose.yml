name: graphor-n8n-e2e

services:
  n8n:
    image: ${N8N_IMAGE:-docker.n8n.io/n8nio/n8n:latest}
    restart: unless-stopped
    ports:
      - "${N8N_PORT:-5678}:5678"
    environment:
      N8N_HOST: localhost
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      WEBHOOK_URL: "http://localhost:${N8N_PORT:-5678}/"
      N8N_SECURE_COOKIE: "false"
      GENERIC_TIMEZONE: ${GENERIC_TIMEZONE:-America/Sao_Paulo}
      TZ: ${GENERIC_TIMEZONE:-America/Sao_Paulo}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?Set N8N_ENCRYPTION_KEY in e2e/.env}
      N8N_COMMUNITY_PACKAGES_ENABLED: "true"
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_VERSION_NOTIFICATIONS_ENABLED: "false"
      N8N_TEMPLATES_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      N8N_LOG_LEVEL: ${N8N_LOG_LEVEL:-debug}
      N8N_LOG_OUTPUT: console
      GRAPHOR_API_KEY: ${GRAPHOR_API_KEY:-}
    volumes:
      - ./.runtime/n8n:/home/node/.n8n
      - ./.runtime/packages:/packages:ro
      - ./fixtures:/fixtures:ro
      - ./workflows:/workflows:ro
